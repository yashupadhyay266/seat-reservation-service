services:

  postgres:
    image: postgres:17
    container_name: seat-postgres
    environment:
      POSTGRES_DB: seatdb
      POSTGRES_USER: seatuser
      POSTGRES_PASSWORD: seatpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: seat-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: