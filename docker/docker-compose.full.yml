services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: seatdb
      POSTGRES_USER: seatuser
      POSTGRES_PASSWORD: seatpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatuser -d seatdb"]
      interval: 5s
      timeout: 5s
      retries: 20


  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  app1:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seatdb
      SPRING_DATASOURCE_USERNAME: seatuser
      SPRING_DATASOURCE_PASSWORD: seatpass

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

      APP_ENV: docker

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/actuator/health/readiness"
        ]
      interval: 10s
      timeout: 3s
      retries: 20


  app2:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seatdb
      SPRING_DATASOURCE_USERNAME: seatuser
      SPRING_DATASOURCE_PASSWORD: seatpass

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

      APP_ENV: docker

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/actuator/health/readiness"
        ]
      interval: 10s
      timeout: 3s
      retries: 20


  gateway:
    image: nginx:1.27-alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app1:
        condition: service_healthy

      app2:
        condition: service_healthy


volumes:
  postgres_data: