# =====================================================
# APPLICATION
# =====================================================

spring.application.name=seat-reservation-service

server.port=8080


# =====================================================
# POSTGRESQL
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/seatdb
spring.datasource.username=seatuser
spring.datasource.password=seatpass


# =====================================================
# JPA / HIBERNATE
# =====================================================

# Flyway owns the schema.
# Hibernate should only verify that entities match it.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# =====================================================
# REDIS
# =====================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s


# =====================================================
# ACTUATOR / HEALTH
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.probes.enabled=true

# Liveness should check only whether the application itself is alive.
management.endpoint.health.group.liveness.include=livenessState

# Readiness must include PostgreSQL because reservations
# cannot safely proceed if PostgreSQL is unavailable.
management.endpoint.health.group.readiness.include=readinessState,db


# =====================================================
# GRACEFUL SHUTDOWN
# =====================================================

server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=20s
app.jwt.issuer=seat-reservation-service
app.jwt.ttl-seconds=3600

# Local development only.
# Override JWT_SECRET in deployment.
app.jwt.secret=${JWT_SECRET:local-dev-secret-key-for-seat-reservation-123456789}

# Used only to obtain an ADMIN token from our test token endpoint.
app.admin.code=${ADMIN_CODE:local-admin-code}

logging.level.root=INFO

logging.level.com.seatreservation.seat_reservation_service.service.ReservationLockService=DEBUG
logging.level.com.seatreservation.seat_reservation_service.service.ReservationFastPathService=DEBUG